<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐠</text></svg>" />
    <title>Worldiator — Feeding Frenzy</title>
    <style>
      /* Boot splash — visible while the JS bundle downloads; SplashScreen.tsx removes it. */
      html, body { margin: 0; height: 100%; background: #020812; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background:
          radial-gradient(ellipse at 50% 30%, rgba(0, 245, 255, 0.14), transparent 60%),
          linear-gradient(180deg, #0d2e4f 0%, #051221 55%, #020812 100%);
        font-family: system-ui, sans-serif; text-align: center;
      }
      #boot-splash .t {
        display: flex; flex-direction: column; line-height: 0.95;
        font-weight: 900; letter-spacing: 0.06em; font-size: clamp(36px, 9vw, 72px); color: #fff;
        text-shadow: 0 0 24px rgba(0, 245, 255, 0.45);
      }
      #boot-splash .t b { color: #ffd700; text-shadow: 0 0 24px rgba(255, 215, 0, 0.45); }
      #boot-splash .bar {
        width: min(280px, 70vw); height: 8px; border-radius: 999px; overflow: hidden;
        background: rgba(5, 25, 51, 0.8); border: 1px solid #1a4b75;
      }
      #boot-splash .bar i {
        display: block; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, #00f5ff, #ffd700);
        animation: bootfill 6s ease-out forwards;
      }
      @keyframes bootfill { from { width: 2%; } to { width: 14%; } }
      #boot-splash p { margin: 0; color: #a1c4e6; font-size: 14px; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status">
      <div class="t"><span>FEEDING</span><b>FRANZEE</b></div>
      <div class="bar"><i></i></div>
      <p>Loading…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
